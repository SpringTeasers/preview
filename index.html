<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Websites — Teaser Previews</title>
<meta name="description" content="Preview directory for Spring Websites teaser sites.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --navy-900: #0b1c2e;
    --navy-700: #1a3a5c;
    --accent: #2f7fd1;
    --slate-100: #eef2f7;
    --slate-400: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--navy-900);
    color: var(--slate-100);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  main { width: 100%; max-width: 640px; }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.35rem;
  }
  p.sub {
    margin: 0 0 1.75rem;
    color: var(--slate-400);
    font-size: 0.95rem;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
  a.card {
    display: block;
    padding: 1.1rem 1.25rem;
    background: var(--navy-700);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--slate-100);
    text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  a.card:hover, a.card:focus {
    background: #21466e;
    border-color: var(--accent);
  }
  a.card strong { display: block; font-size: 1.05rem; font-weight: 600; }
  a.card span {
    display: block;
    margin-top: 0.3rem;
    color: var(--slate-400);
    font-size: 0.875rem;
  }
  footer {
    margin-top: 2rem;
    color: var(--slate-400);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <h1>Spring Websites — Teaser Previews</h1>
  <p class="sub">Client review links. Each teaser has its own address.</p>
  <ul>
    <li>
      <a class="card" href="/juanes-home-improvement/">
        <strong>Juanes Home Improvement, LLC</strong>
        <span>Roofing, siding, windows &amp; doors &mdash; Wallingford, CT</span>
      </a>
    </li>
  </ul>
  <footer>Spring Websites &middot; preview.springwebsites.com</footer>
</main>
</body>
</html>
